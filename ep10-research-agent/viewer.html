<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>disk view</title>
<style>
  :root { --bg:#1e1f24; --panel:#26272e; --line:#34363f; --text:#d7d9e0; --dim:#8b8e99; --accent:#4f9cf9; --warn:#ffd166; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:16px/1.6 "SF Mono", Menlo, monospace; min-height:100vh; }
  header { display:flex; align-items:center; gap:14px; padding:14px 24px; background:var(--panel); border-bottom:1px solid var(--line); }
  header .app { color:var(--dim); font-size:13px; letter-spacing:1px; }
  header .path { color:var(--accent); font-size:15px; }
  main { padding:28px 36px; }
  .tree { font-size:20px; line-height:1.9; }
  .tree .dir { color:var(--text); font-weight:700; }
  .tree .file { color:var(--dim); }
  .tree .size { color:var(--dim); font-size:14px; margin-left:14px; }
  .tree .hl { color:var(--warn); background:#2b2417; border:1px solid #4a3d1e; border-radius:6px; padding:1px 10px; }
  pre { font:16px/1.65 "SF Mono", Menlo, monospace; color:var(--text); white-space:pre-wrap; max-width:1400px; }
  table { border-collapse:collapse; margin-top:6px; font-size:16px; }
  th, td { border:1px solid var(--line); padding:9px 16px; text-align:left; }
  th { background:var(--panel); color:var(--dim); font-weight:600; }
  td { color:var(--text); }
  tr.hl td { background:#2b2417; color:var(--warn); }
</style>
</head>
<body>
<header><span class="app">disk view</span><span class="path" id="path"></span></header>
<main id="main"></main>
<script>
  const q = new URLSearchParams(location.search);
  const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt !== undefined) e.textContent = txt; return e; };
  (async () => {
    const main = document.getElementById('main');
    const pathEl = document.getElementById('path');
    if (q.get('dir') !== null) {
      const dir = q.get('dir');
      const hl = q.get('hl') || '';
      pathEl.textContent = dir + '/';
      const tree = await window.fsTree(dir);
      const box = el('div', 'tree');
      const render = (nodes, depth) => {
        for (const n of nodes) {
          const row = el('div');
          row.style.paddingLeft = depth * 34 + 'px';
          const label = el('span', n.dir ? 'dir' : 'file', (n.dir ? '▸ ' : '· ') + n.name + (n.dir ? '/' : ''));
          if (hl && n.rel.includes(hl)) label.classList.add('hl');
          row.appendChild(label);
          if (!n.dir) row.appendChild(el('span', 'size', n.size + ' B'));
          box.appendChild(row);
          if (n.children) render(n.children, depth + 1);
        }
      };
      render(tree, 0);
      main.appendChild(box);
    } else if (q.get('file')) {
      const f = q.get('file');
      pathEl.textContent = f;
      const content = await window.fsRead(f);
      if (q.get('mode') === 'table') {
        const rows = content.trim().split('\n').map((l) =>
          l.match(/("([^"]|"")*"|[^,]*)(,|$)/g).filter(Boolean).map((c) => c.replace(/,$/, '').replace(/^"|"$/g, '').replace(/""/g, '"'))
        );
        const hl = q.get('hl') || null;
        const table = el('table');
        rows.forEach((cells, i) => {
          const tr = el('tr');
          if (hl && i > 0 && cells.some((c) => c.includes(hl))) tr.className = 'hl';
          for (const c of cells) tr.appendChild(el(i === 0 ? 'th' : 'td', null, c));
          table.appendChild(tr);
        });
        main.appendChild(table);
      } else {
        main.appendChild(el('pre', null, content));
      }
    }
    document.title = 'disk view — ready';
  })();
</script>
</body>
</html>
